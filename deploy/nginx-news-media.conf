# Include inside each Mecca Hotel server block that proxies to port 3003.
# Nginx serves curated public media with MP4 MIME types and byte-range support.
location ^~ /videos/news/ {
    alias /var/www/makka-hotel/web/public/videos/news/;
    types { video/mp4 mp4; }
    default_type application/octet-stream;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=3600";
}
